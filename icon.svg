<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="sc-title">
  <title id="sc-title">会话清理</title>
  <defs>
    <!-- 主体渐变：青 → 绿 → 黄绿（左上到右下），与 model-proxy 的蓝→紫同一套线条渐变语言、换色相 -->
    <linearGradient id="sc-line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset=".55" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#84cc16"/>
    </linearGradient>
  </defs>
  <!-- 清洁星芒（呼应 model-proxy 的速度线点缀，语义=干净） -->
  <path d="M53 7l1.3 3.7L58 12l-3.7 1.3L53 17l-1.3-3.7L48 12l3.7-1.3z" fill="url(#sc-line)" opacity=".85"/>
  <!-- 桶盖 -->
  <path d="M13 20H51" stroke="url(#sc-line)" stroke-width="3.4" stroke-linecap="round" fill="none"/>
  <path d="M27 20a5 5 0 0 1 10 0" fill="none" stroke="url(#sc-line)" stroke-width="3" stroke-linecap="round"/>
  <!-- 桶身（上宽下窄，圆角底） -->
  <path d="M18 25H46l-3.5 26Q42 53.5 40 53.5H24Q22 53.5 21.5 51L18 25Z" fill="none" stroke="url(#sc-line)" stroke-width="3" stroke-linejoin="round"/>
  <!-- 桶身竖向棱线 -->
  <path d="M27 31v15M37 31v15" stroke="url(#sc-line)" stroke-width="2.2" stroke-linecap="round" fill="none" opacity=".6"/>
</svg>
